name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Minify CSS and JavaScript
        run: |
          npx --yes esbuild@0.25.9 css/style.css --minify --outfile=css/style.css --allow-overwrite
          for f in js/config.js js/i18n.js js/home.js js/key3d.js; do
            npx --yes esbuild@0.25.9 "$f" --minify --outfile="$f" --allow-overwrite
          done

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
