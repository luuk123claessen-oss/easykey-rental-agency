name: Deploy preview

# Branch previews go to a separate Worker (pd-preview), never to the live site.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep the preview out of search engines
        run: |
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > _headers
          printf 'User-agent: *\nDisallow: /\n' > robots.txt

      - name: Deploy preview
        run: npx wrangler deploy --name pd-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
