name: Deploy preview

# Branch previews go to a separate Worker (pd-preview), never to the live site.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Minify CSS and JavaScript
        run: |
          npx --yes esbuild@0.25.9 css/style.css --minify --outfile=css/style.css --allow-overwrite
          for f in js/config.js js/i18n.js js/home.js js/key3d.js; do
            npx --yes esbuild@0.25.9 "$f" --minify --outfile="$f" --allow-overwrite
          done

      - name: Keep the preview out of search engines
        run: |
          printf '\n/*\n  X-Robots-Tag: noindex, nofollow\n' >> _headers
          printf 'User-agent: *\nDisallow: /\n' > robots.txt

      - name: Deploy preview
        run: |
          # redesign-v2 keeps the original preview Worker; every other branch gets its own.
          if [ "$GITHUB_REF_NAME" = "redesign-v2" ]; then
            NAME=pd-preview
          else
            NAME="pd-preview-$(echo "$GITHUB_REF_NAME" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9\n' '-' | sed 's/-*$//' | cut -c1-40)"
          fi
          echo "Deploying to $NAME"
          npx wrangler deploy --name "$NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
